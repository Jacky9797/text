<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式數學講義 - 三角形的認識與分類</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        .math-line {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            line-height: 1.8;
            margin: 14px 0;
        }
        .math, .math-display {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
        }
        .math-display {
            justify-content: center;
            width: 100%;
            overflow-x: auto;
            padding: 8px 0;
        }
        .katex {
            font-size: 1.12em;
        }
        .slot {
            min-width: 58px;
            min-height: 46px;
            padding: 4px 12px;
            border: 3px solid #93c5fd;
            border-radius: 12px;
            background: #eff6ff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1d4ed8;
            cursor: pointer;
            font-size: 24px;
            font-weight: 800;
            transition: all 0.2s ease;
        }
        .slot.active {
            animation: pulseSlot 1s infinite;
            background: #dbeafe;
            border-color: #2563eb;
        }
        .slot.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #166534;
        }
        @keyframes pulseSlot {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.45); }
            70% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <header class="bg-teal-800 text-white shadow-md sticky top-0 z-50">

                    單元：三角形與分類
                </span>

                </nav>
            </div>
            
            <!-- Right: Student Name, Score, Timer & Record Button -->

    <!-- Main Content Area -->

            </div>
        </section>

        <!-- Right Column: Step-by-Step Unlock Flow -->

        </section>

    </main>

    <!-- Detailed Record Modal -->

    <!-- Completion Modal -->

    <!-- JavaScript Application Logic -->

                    <svg viewBox="0 0 300 200" class="w-full h-44">
                        <rect x="30" y="40" width="100" height="130" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
                        <line x1="30" y1="40" x2="130" y2="170" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
                        <text x="135" y="175" fill="#dc2626" font-size="20">✂</text>
                        
                        <!-- Unfolded Result Triangle -->
                        <polygon points="220,40 170,170 270,170" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/>
                        <text x="210" y="120" fill="#5b21b6" font-weight="bold" font-size="16">展開圖</text>
                    </svg>
                `,
                steps: [
                    {
                        instruction: "步驟 1：把對摺紙沿虛線剪下並攤開後，左右兩邊會對稱相等，攤開後會是什麼圖形？",
                        htmlContent: `<span>攤開後的圖形是</span><span class="slot" data-answer="等腰"></span><span>三角形。</span>`,
                        options: ["正", "等腰", "長方形"],
                        correct: ["等腰"]
                    }
                ]
            },
            {
                id: 8,
                title: "題目 8：全等三角形的概念",
                desc: "當兩個三角形能<mark class='bg-teal-100 text-teal-900 px-1 rounded'>完全疊合</mark>（形狀和大小都相同）時，我們稱這兩個三角形全等。",
                svg: `
                    <svg viewBox="0 0 300 200" class="w-full h-44">
                        <polygon points="80,40 30,160 120,160" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
                        <text x="65" y="110" font-weight="bold" fill="#065f46">圖 A</text>

                        <polygon points="230,40 180,160 270,160" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
                        <text x="215" y="110" font-weight="bold" fill="#065f46">圖 B</text>
                    </svg>
                `,
                steps: [
                    {
                        instruction: "步驟 1：若兩個三角形重疊在一起時完全重合，稱為？",
                        htmlContent: `<span>稱這兩個三角形為</span><span class="slot" data-answer="全等"></span><span>三角形。</span>`,
                        options: ["相似", "全等", "等腰"],
                        correct: ["全等"]
                    },
                    {
                        instruction: "步驟 2：全等三角形疊合在一起的邊與角分別叫作什麼？",
                        htmlContent: `<span>疊合的邊叫</span><span class="slot" data-answer="對應邊"></span><span>，疊合的角叫</span><span class="slot" data-answer="對應角"></span><span>。</span>`,
                        options: ["對應邊", "等長邊", "對應角", "相同角"],
                        correct: ["對應邊", "對應角"]
                    }
                ]
            }
        ];

        // Global State Variables
        let currentQuestionIndex = 0;
        let score = 0;
        let maxScore = questions.reduce((acc, q) => acc + q.steps.length, 0);
        let elapsedTime = 0; // Stopwatch timer in seconds
        let timerInterval = null;
        let isCompleted = false;

        // User step progress state
        let userState = questions.map(q => ({
            stepStatus: q.steps.map(s => ({
                unlocked: false,
                completed: false,
                scored: false,
                failed: false,
                slotsData: new Array(s.correct.length).fill("")
            }))
        }));
        userState[0].stepStatus[0].unlocked = true;

        // Initialize on DOM load
        window.addEventListener("DOMContentLoaded", () => {
            document.getElementById("max-score-display").textContent = maxScore;
            renderNavTabs();
            renderCurrentQuestion();
            startTimer();
            if (typeof renderMath === 'function') renderMath();
        });

        // Stopwatch Timer function
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isCompleted) return;
                elapsedTime++;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
            const secs = (elapsedTime % 60).toString().padStart(2, '0');
            document.getElementById("timer-display").textContent = `${mins}:${secs}`;
        }

        // Render Nav Tabs
        function renderNavTabs() {
            const navContainer = document.getElementById("nav-tabs");
            navContainer.innerHTML = "";
            questions.forEach((q, idx) => {
                const btn = document.createElement("button");
                btn.className = `px-3 py-1.5 rounded-lg text-sm font-semibold transition shrink-0 ${idx === currentQuestionIndex ? 'bg-white text-teal-900 shadow' : 'bg-teal-900/60 hover:bg-teal-700 text-white'}`;
                btn.textContent = `題目 ${idx + 1}`;
                btn.onclick = () => switchQuestion(idx);
                navContainer.appendChild(btn);
            });
        }

        function switchQuestion(idx) {
            currentQuestionIndex = idx;
            renderNavTabs();
            renderCurrentQuestion();
        }

        // Render Current Question Detail
        function renderCurrentQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById("q-title").textContent = q.title;
            document.getElementById("q-desc").innerHTML = q.desc;
            document.getElementById("q-svg-container").innerHTML = q.svg;
            renderSteps();
        }

        // Render Steps Flow
        function renderSteps() {
            const container = document.getElementById("steps-container");
            container.innerHTML = "";
            const qState = userState[currentQuestionIndex];

            questions[currentQuestionIndex].steps.forEach((step, stepIdx) => {
                const status = qState.stepStatus[stepIdx];
                if (!status.unlocked) return;

                const stepCard = document.createElement("div");
                stepCard.className = `bg-white rounded-2xl shadow-md p-6 border transition-all duration-300 ${status.completed ? 'border-emerald-200 bg-emerald-50/20' : 'border-teal-100'}`;
                
                let headerHtml = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs font-bold px-2.5 py-1 rounded-md ${status.completed ? 'bg-emerald-100 text-emerald-800' : 'bg-teal-100 text-teal-800'}">
                            步驟 ${stepIdx + 1}
                        </span>
                        ${status.completed ? '<span class="text-emerald-600 font-bold text-sm flex items-center">✔ 完成</span>' : ''}
                    </div>
                    <p class="text-slate-700 font-medium mb-4">${step.instruction}</p>
                `;

                let contentHtml = buildStepContentHtml(step, status, stepIdx);

                let optionsHtml = "";
                if (!status.completed) {
                    if (!step._shuffledOptions) {
                        step._shuffledOptions = [...step.options].sort(() => Math.random() - 0.5);
                    }
                    let optBtns = step._shuffledOptions.map(opt => `
                        <button onclick="handleOptionClick(${currentQuestionIndex}, ${stepIdx}, '${opt}')" 
                            class="bg-white hover:bg-blue-50 border-2 border-blue-200 hover:border-blue-400 text-blue-900 font-bold px-4 py-2.5 rounded-xl shadow-sm transition transform active:scale-95 text-lg">
                            ${opt}
                        </button>
                    `).join("");

                    optionsHtml = `
                        <div class="mt-6 pt-4 border-t border-slate-100">
                            <div class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">點擊選項填入空格：</div>
                            <div class="flex flex-wrap gap-2 mb-4">
                                ${optBtns}
                            </div>
                            <div class="flex items-center justify-between">
                                <div id="feedback-${currentQuestionIndex}-${stepIdx}" class="text-sm font-bold"></div>
                                <button onclick="checkAnswer(${currentQuestionIndex}, ${stepIdx})" 
                                    class="bg-teal-600 hover:bg-teal-700 text-white font-bold px-6 py-2 rounded-xl shadow transition transform active:scale-95">
                                    檢查答案
                                </button>
                            </div>
                        </div>
                    `;
                }

                stepCard.innerHTML = headerHtml + contentHtml + optionsHtml;
                container.appendChild(stepCard);
            });

            if (typeof renderMath === 'function') renderMath();
        }

        function buildStepContentHtml(step, status, stepIdx) {
            let slotCounter = 0;
            let tempHtml = step.htmlContent.replace(/<span class="slot"[^>]*><\/span>/g, (match) => {
                const val = status.slotsData[slotCounter] || "";
                const sIdx = slotCounter;
                slotCounter++;
                let isActive = false;
                if (!status.completed) {
                    const firstEmpty = status.slotsData.findIndex(s => s === "");
                    if (firstEmpty === sIdx || (firstEmpty === -1 && sIdx === status.slotsData.length - 1 && val !== "")) {
                        isActive = true;
                    }
                }
                const activeClass = isActive ? "active" : "";
                const correctClass = status.completed ? "correct" : "";
                return `<span class="slot ${activeClass} ${correctClass}" onclick="handleSlotClick(${currentQuestionIndex}, ${stepIdx}, ${sIdx})">${val}</span>`;
            });
            return `<div class="my-3">${tempHtml}</div>`;
        }

        // Handle Option Click
        function handleOptionClick(qIdx, stepIdx, opt) {
            const qState = userState[qIdx];
            const status = qState.stepStatus[stepIdx];
            if (status.completed) return;

            const emptyIdx = status.slotsData.findIndex(s => s === "");
            if (emptyIdx !== -1) {
                status.slotsData[emptyIdx] = opt;
                renderSteps();
            }
        }

        // Handle Slot Click (Clear slot)
        function handleSlotClick(qIdx, stepIdx, sIdx) {
            const qState = userState[qIdx];
            const status = qState.stepStatus[stepIdx];
            if (status.completed) return;

            status.slotsData[sIdx] = "";
            renderSteps();
        }

        // Check Answer Logic
        function checkAnswer(qIdx, stepIdx) {
            const q = questions[qIdx];
            const step = q.steps[stepIdx];
            const qState = userState[qIdx];
            const status = qState.stepStatus[stepIdx];
            const feedbackEl = document.getElementById(`feedback-${qIdx}-${stepIdx}`);

            if (status.slotsData.some(s => s === "")) {
                feedbackEl.textContent = "請填滿所有空格";
                feedbackEl.className = "text-sm font-bold text-amber-600";
                return;
            }

            let isCorrect = true;
            for (let i = 0; i < step.correct.length; i++) {
                if (status.slotsData[i] !== step.correct[i]) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                status.completed = true;
                feedbackEl.textContent = "✔ 答對了！";
                feedbackEl.className = "text-sm font-bold text-emerald-600";

                if (!status.scored && !status.failed) {
                    status.scored = true;
                    score++;
                    document.getElementById("score-display").textContent = score;
                }

                // Unlock next step or auto-advance question
                if (stepIdx + 1 < q.steps.length) {
                    qState.stepStatus[stepIdx + 1].unlocked = true;
                    setTimeout(() => {
                        renderSteps();
                    }, 400);
                } else {
                    // Question All Steps Completed
                    if (qIdx + 1 < questions.length) {
                        userState[qIdx + 1].stepStatus[0].unlocked = true;
                        setTimeout(() => {
                            switchQuestion(qIdx + 1);
                        }, 800);
                    } else {
                        setTimeout(() => {
                            renderSteps();
                            checkAllCompleted();
                        }, 400);
                    }
                }

            } else {
                status.failed = true;
                feedbackEl.textContent = "再想想看喔！請重新訂正。";
                feedbackEl.className = "text-sm font-bold text-rose-600";
            }
        }

        // Check if all questions completed
        function checkAllCompleted() {
            let allDone = true;
            for (let i = 0; i < questions.length; i++) {
                for (let j = 0; j < questions[i].steps.length; j++) {
                    if (!userState[i].stepStatus[j].completed) {
                        allDone = false;
                        break;
                    }
                }
                if (!allDone) break;
            }

            if (allDone && !isCompleted) {
                isCompleted = true;
                clearInterval(timerInterval);
                triggerCompletion();
            }
        }

        function triggerCompletion() {
            const modal = document.getElementById("completion-modal");
            const modalContent = document.getElementById("completion-modal-content");
            const finalScoreEl = document.getElementById("final-score");
            const finalTimeEl = document.getElementById("final-time");

            finalScoreEl.textContent = `${score} / ${maxScore}`;
            
            const mins = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
            const secs = (elapsedTime % 60).toString().padStart(2, '0');
            finalTimeEl.textContent = `${mins}:${secs}`;

            modal.classList.remove("hidden");
            setTimeout(() => {
                modalContent.classList.remove("scale-95", "opacity-0");
                modalContent.classList.add("scale-100", "opacity-100");
            }, 10);
        }

        function closeModal() {
            document.getElementById("completion-modal").classList.add("hidden");
        }

        // Answer Record Modal Functions
        function openRecordModal() {
            const modal = document.getElementById("record-modal");
            const modalContent = document.getElementById("record-modal-content");
            const nameInput = document.getElementById("student-name").value.trim();
            
            document.getElementById("record-student-name").textContent = nameInput || "未填寫";
            document.getElementById("record-score").textContent = `${score} / ${maxScore}`;
            
            const mins = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
            const secs = (elapsedTime % 60).toString().padStart(2, '0');
            document.getElementById("record-time").textContent = `${mins}:${secs}`;

            // Render detailed log per question
            const listContainer = document.getElementById("record-list");
            listContainer.innerHTML = "";

            questions.forEach((q, idx) => {
                const qState = userState[idx];
                const totalSteps = q.steps.length;
                const completedSteps = qState.stepStatus.filter(s => s.completed).length;
                const earnedPoints = qState.stepStatus.filter(s => s.scored).length;

                let statusBadge = "";
                if (completedSteps === totalSteps) {
                    statusBadge = `<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">✔ 全部完成 (${earnedPoints}/${totalSteps}分)</span>`;
                } else if (completedSteps > 0) {
                    statusBadge = `<span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full">⏳ 作答中 (${completedSteps}/${totalSteps}步)</span>`;
                } else {
                    statusBadge = `<span class="bg-slate-100 text-slate-500 text-xs font-bold px-2.5 py-1 rounded-full">未開始</span>`;
                }

                const item = document.createElement("div");
                item.className = "p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between text-sm shadow-sm";
                item.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-slate-700">題目 ${idx + 1}：</span>
                        <span class="text-slate-600 truncate max-w-[180px]">${q.title.replace(`題目 ${idx + 1}：`, '')}</span>
                    </div>
                    <div>${statusBadge}</div>
                `;
                listContainer.appendChild(item);
            });

            modal.classList.remove("hidden");
            setTimeout(() => {
                modalContent.classList.remove("scale-95", "opacity-0");
                modalContent.classList.add("scale-100", "opacity-100");
            }, 10);
        }

        function closeRecordModal() {
            document.getElementById("record-modal").classList.add("hidden");
        }

        function resetAll() {
            closeModal();
            closeRecordModal();
            score = 0;
            elapsedTime = 0;
            isCompleted = false;
            document.getElementById("score-display").textContent = score;
            document.getElementById("timer-display").textContent = "00:00";

            userState = questions.map(q => ({
                stepStatus: q.steps.map(s => ({
                    unlocked: false,
                    completed: false,
                    scored: false,
                    failed: false,
                    slotsData: new Array(s.correct.length).fill("")
                }))
            }));
            userState[0].stepStatus[0].unlocked = true;
            currentQuestionIndex = 0;

            questions.forEach(q => {
                q.steps.forEach(s => delete s._shuffledOptions);
            });

            renderNavTabs();
            renderCurrentQuestion();
            startTimer();
        }
    </script>
</body>
</html>
