<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="數學互動教材與學習頁面。">
  <title>數學學習頁面</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 72px 0; }
    .eyebrow { color: #52617a; font-size: .9rem; letter-spacing: .08em; }
    h1 { margin: 10px 0 12px; font-size: clamp(2rem, 6vw, 3rem); }
    .intro { margin: 0; color: #52617a; line-height: 1.7; }
    .toolbar { margin: 32px 0 16px; }
    label { display: block; margin-bottom: 8px; font-weight: 650; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #cbd3e1; border-radius: 10px; background: white; font: inherit; }
    input:focus-visible, a:focus-visible { outline: 3px solid #8ab4ff; outline-offset: 2px; }
    ul { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
    li a { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border: 1px solid #dce2ed; border-radius: 12px; background: #fff; color: #174ea6; font-weight: 650; text-decoration: none; box-shadow: 0 2px 8px #1720330a; }
    li a:hover { border-color: #8aaee8; background: #fafdff; }
    .arrow { color: #6b7890; font-size: 1.2rem; }
    #empty { color: #65728a; padding: 16px 2px; }
    footer { margin-top: 36px; color: #65728a; font-size: .9rem; line-height: 1.6; }
    code { padding: 2px 5px; border-radius: 4px; background: #e8ecf4; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">學習資源</p>
    <h1>數學學習頁面</h1>
    <p class="intro">選擇下方頁面開始學習。之後新增教材時，也可以把它加入這份清單。</p>

    <div class="toolbar">
      <label for="search">搜尋頁面</label>
      <input id="search" type="search" placeholder="輸入檔名或名稱" autocomplete="off">
    </div>
    <ul id="page-list" aria-label="教材頁面"></ul>
    <p id="empty" hidden>沒有符合的頁面。</p>

    <footer>
      新增 HTML 教材後，請在 <code>index.html</code> 的 <code>pages</code> 清單中新增一筆，填入顯示名稱與相對檔案路徑；GitHub Pages 部署後就會出現在這裡。
    </footer>
  </main>

  <script>
    // Add future pages here. Paths are relative to this index.html.
    const pages = [
      { title: "115A1U5", path: "數學/115A1U5.html" },
      // Example: remove the leading // after creating this file.
      // { title: "115A1U6", path: "國語/115A1U6.html" }
    ];

    const list = document.querySelector("#page-list");
    const search = document.querySelector("#search");
    const empty = document.querySelector("#empty");

    function renderPages() {
      const query = search.value.trim().toLocaleLowerCase();
      const matches = pages.filter(({ title, path }) =>
        `${title} ${path}`.toLocaleLowerCase().includes(query)
      );
      list.replaceChildren(...matches.map(({ title, path }) => {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.href = path;
        const name = document.createElement("span");
        name.textContent = title;
        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "→";
        link.append(name, arrow);
        item.append(link);
        return item;
      }));
      empty.hidden = matches.length !== 0;
    }

    search.addEventListener("input", renderPages);
    renderPages();
  </script>
</body>
</html>
