     <section id="completion-summary" data-template-id="completion-panel" class="canva-panel mt-5 hidden rounded-[24px] border-2 border-[#a4cfb3] bg-[#eff9f0] p-6 text-center" aria-live="polite" style="background: rgb(239, 249, 240);">
      <i data-lucide="sprout" class="mx-auto mb-3 h-10 w-10 text-[#397454]" aria-hidden="true"></i>
      <h2 data-template-id="completion-title" class="canva-text font-bold" style="color: rgb(36, 95, 59); font-weight: 700; font-style: normal; font-size: 27px;">練習完成</h2>
      <p id="completion-text" class="mt-3 font-semibold text-[#356246]"></p>
      <p id="save-status" class="mt-2 font-semibold" role="status"></p>
      <p data-template-id="completion-help" class="canva-text mt-2" style="color: rgb(82, 112, 131); font-weight: 400; font-style: normal; font-size: 17px;">做得很好！你可以按下「重新開始」，再挑戰一次答對更多題。</p>
     </section>
    </section>
    <section id="history-section" aria-labelledby="history-heading" class="mx-auto mt-10 w-full max-w-6xl">
     <div data-template-id="history-panel" class="canva-panel panel-card bg-white/90 p-5 sm:p-7" style="background: rgba(255, 255, 255, 0.9);">
      <div class="flex items-center gap-3">
       <i data-lucide="history" class="h-6 w-6 text-[#39745f]" aria-hidden="true"></i>
       <h2 id="history-heading" data-template-id="history-heading-text" class="canva-text font-bold" style="color: rgb(22, 78, 108); font-weight: 700; font-style: normal; font-size: 27px;">歷史作答紀錄</h2>
      </div>
      <p data-template-id="history-description" class="canva-text mt-3 leading-7" style="color: rgb(70, 101, 116); font-weight: 400; font-style: normal; font-size: 16px; line-height: 1.6;">這裡會記錄每位學生的作答次數、第一次答對題數與錯題清單。</p>
      <div id="history-list" class="mt-5 grid gap-3" aria-live="polite">
       <p>正在讀取作答紀錄…</p>
      </div>
      <button id="retry-button" type="button" data-template-id="retry-button" class="canva-button secondary-action mt-4 hidden" style="background: rgb(255, 255, 255); color: rgb(27, 82, 106); font-weight: 700; font-style: normal; font-size: 18px;">重試讀取</button>
     </div>
    </section>
    <section id="reference-section" aria-labelledby="reference-heading" class="mx-auto mt-10 hidden w-full max-w-6xl">
     <details data-template-id="reference-panel" class="canva-panel panel-card bg-white/90 p-5 sm:p-7" style="background: rgba(255, 255, 255, 0.9);">
      <summary class="cursor-pointer list-none">
       <div class="flex items-center gap-3">
        <i data-lucide="book-open" class="h-6 w-6 text-[#39745f]" aria-hidden="true"></i>
        <h2 id="reference-heading" data-template-id="reference-heading-text" class="canva-text font-bold" style="color: rgb(22, 78, 108); font-weight: 700; font-style: normal; font-size: 27px;">本課生字複習</h2>
        <i data-lucide="chevron-down" class="ml-auto h-5 w-5 text-[#527083]" aria-hidden="true"></i>
       </div>
      </summary>
      <p data-template-id="reference-description" class="canva-text mt-4 leading-7" style="color: rgb(70, 101, 116); font-weight: 400; font-style: normal; font-size: 16px; line-height: 1.6;">展開後可複習第八課十五個生字的注音與意思。</p>
      <div id="complete-content" class="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3" aria-label="第八課十五個生字複習"></div>
     </details>
    </section>
   </main>
  </div>
  <template id="question-template">
   <article data-template-id="question-card" class="canva-card question-card">
    <div class="flex items-center justify-between gap-3">
     <span class="question-number"></span><span class="question-state font-bold text-[#527083]"></span>
    </div>
    <p class="question-sentence mt-4"></p>
    <p class="question-help mt-3 font-semibold text-[#527083]"></p>
    <div class="option-grid mt-5 grid grid-cols-3 gap-2"></div>
    <p class="answer-feedback mt-4" aria-live="polite"></p>
   </article>
  </template>
  <script>
  const questionBank = [
    {id:"q01",word:"俠",phonetic:"ㄒㄧㄚˊ",sentence:"他樂於助人，像一位平凡的大____。",choices:["俠","夾","狹"],meaning:"重義氣、肯幫助別人的人；大俠。"},
    {id:"q02",word:"頓",phonetic:"ㄉㄨㄣˋ",sentence:"聽到好消息，大家____時露出笑容。",choices:["頓","鈍","噸"],meaning:"立刻、忽然；頓時。"},
    {id:"q03",word:"江",phonetic:"ㄐㄧㄤ",sentence:"寬闊的____河在陽光下閃閃發亮。",choices:["江","紅","工"],meaning:"大河；江河。"},
    {id:"q04",word:"鞋",phonetic:"ㄒㄧㄝˊ",sentence:"他彎下腰，幫小朋友繫好____帶。",choices:["鞋","蛙","娃"],meaning:"穿在腳上保護腳的物品；鞋子。"},
    {id:"q05",word:"溼",phonetic:"ㄕ",sentence:"雨後的地面很____，走路要小心。",choices:["溼","濕","顯"],meaning:"含水分，與乾相反；溼透。"},
    {id:"q06",word:"柱",phonetic:"ㄓㄨˋ",sentence:"走廊旁的石____支撐著屋頂。",choices:["柱","住","注"],meaning:"支撐建築物的長條物；柱子。"},
    {id:"q07",word:"止",phonetic:"ㄓˇ",sentence:"看到紅燈，行人要停____腳步。",choices:["止","址","正"],meaning:"停下來；停止。"},
    {id:"q08",word:"措",phonetic:"ㄘㄨㄛˋ",sentence:"面對突來的問題，他一時不知所____。",choices:["措","錯","借"],meaning:"安排、處理；不知所措。"},
    {id:"q09",word:"撐",phonetic:"ㄔㄥ",sentence:"大家一起幫忙____起傾斜的棚架。",choices:["撐","掌","堂"],meaning:"支持、支住；支撐。"},
    {id:"q10",word:"概",phonetic:"ㄍㄞˋ",sentence:"我大____知道這件事的經過了。",choices:["概","溉","慨"],meaning:"大略；大概。"},
    {id:"q11",word:"折",phonetic:"ㄓㄜˊ",sentence:"他把紙____成一隻小船。",choices:["折","拆","析"],meaning:"彎轉或對疊；折疊。"},
    {id:"q12",word:"根",phonetic:"ㄍㄣ",sentence:"樹____吸收水分，讓大樹長得更高。",choices:["根","跟","銀"],meaning:"植物吸收水分的部分；樹根。"},
    {id:"q13",word:"脫",phonetic:"ㄊㄨㄛ",sentence:"進屋前，他先____下沾滿泥土的鞋。",choices:["脫","說","稅"],meaning:"離開或除去；脫下。"},
    {id:"q14",word:"愣",phonetic:"ㄌㄥˋ",sentence:"看到大家為他鼓掌，他驚訝得____住了。",choices:["愣","楞","稜"],meaning:"因吃驚而呆住；愣住。"},
    {id:"q15",word:"帥",phonetic:"ㄕㄨㄞˋ",sentence:"他扶起跌倒的同學，模樣真____氣。",choices:["帥","師","獅"],meaning:"英俊好看；帥氣。"}
  ];
  const state = {studentName:"",groupIndex:0,completed:new Set(),attempts:{},wrongChoices:{},firstTryCorrect:new Set(),soundEnabled:false,fontStep:0,finished:false};
  const groupSize = 3;
  let backendRecords = [], initialLoadTimer, readReady = false;
  const $ = id => document.getElementById(id);
  function shuffle(values) {
    const copy = [...values];
    for(let i=copy.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; }
    return copy;
  }
  function renderCompleteContent() {
    const holder=$("complete-content");
    if(holder.childElementCount) return;
    questionBank.forEach(q => {
      const article=document.createElement("article");
      article.className="rounded-2xl border-2 border-[#d6e8e6] bg-white px-4 py-4";
      const heading=document.createElement("h3");
      heading.className="font-bold text-[#164e6c]";
      heading.textContent=q.word+"　"+q.phonetic;
      const meaning=document.createElement("p");
      meaning.className="mt-2 leading-7 text-[#466574]";
      meaning.textContent=q.meaning;
      article.append(heading,meaning); holder.append(article);
    });
  }
  function currentQuestions() { return questionBank.slice(state.groupIndex*groupSize,(state.groupIndex+1)*groupSize); }
  function renderQuestions() {
    const holder=$("question-grid"); holder.replaceChildren();
    currentQuestions().forEach((q,index) => {
      const fragment=$("question-template").content.cloneNode(true), card=fragment.querySelector(".question-card");
      const done=state.completed.has(q.id);
      card.dataset.questionId=q.id; card.classList.toggle("is-complete",done); card.classList.toggle("is-pending",!done);
      card.querySelector(".question-number").textContent="第 "+(state.groupIndex*groupSize+index+1)+" 題";
      card.querySelector(".question-state").textContent=done?"已答對":"請作答";
      card.querySelector(".question-sentence").textContent=q.sentence;
      card.querySelector(".question-help").textContent="注音："+q.phonetic+"　選出正確的字。";
      const options=card.querySelector(".option-grid");
      shuffle(q.choices).forEach(choice => {
        const button=document.createElement("button");
        button.type="button"; button.className="answer-option"; button.textContent=choice; button.dataset.choice=choice;
        button.setAttribute("aria-label","選擇「"+choice+"」");
        if(done) { button.disabled=true; if(choice===q.word) button.classList.add("is-correct"); }
        else if((state.wrongChoices[q.id]||[]).includes(choice)) { button.disabled=true; button.classList.add("is-incorrect"); }
        button.addEventListener("click",()=>answerQuestion(q,card,button)); options.append(button);
      });
      const feedback=card.querySelector(".answer-feedback");
      feedback.textContent=done?"答對了！正確答案是「"+q.word+"」。":"請選擇最適合填入句子的字。";
      if(done) feedback.classList.add("good");
      holder.append(fragment);
    });
    updateProgress(); updateNextButton(); $("completion-summary").classList.add("hidden");
  }
  function answerQuestion(q,card,button) {
    if(state.completed.has(q.id)) return;
    const first=!state.attempts[q.id];
    state.attempts[q.id]=(state.attempts[q.id]||0)+1;
    const correct=button.dataset.choice===q.word, feedback=card.querySelector(".answer-feedback");
    if(correct) {
      state.completed.add(q.id); if(first) state.firstTryCorrect.add(q.id);
      card.classList.replace("is-pending","is-complete");
      card.querySelector(".question-state").textContent="已答對";
      feedback.textContent="答對了！正確答案是「"+q.word+"」。";
      feedback.className="answer-feedback mt-4 good";
      card.querySelectorAll(".answer-option").forEach(option=>{ option.disabled=true; if(option.dataset.choice===q.word) option.classList.add("is-correct"); });
    } else {
      (state.wrongChoices[q.id] ||= []).push(button.dataset.choice);
      button.classList.add("is-incorrect"); button.disabled=true;
      feedback.textContent="再試一次，慢慢看字形和句子的意思。";
      feedback.className="answer-feedback mt-4 try";
    }
    playTone(correct); updateProgress(); updateNextButton();
  }
  function updateProgress() {
    $("progress-label").textContent="完成："+state.completed.size+"／"+questionBank.length+" 題";
    $("progress-fill").style.width=(state.completed.size/questionBank.length*100)+"%";
  }
  function updateNextButton() { $("next-button").disabled=!currentQuestions().every(q=>state.completed.has(q.id))||state.finished; }
  function moveNext() {
    if(state.finished||!currentQuestions().every(q=>state.completed.has(q.id))) return;
    if(state.groupIndex===Math.ceil(questionBank.length/groupSize)-1) { showCompletion(); return; }
    state.groupIndex++; renderQuestions(); $("game-heading").scrollIntoView({behavior:"smooth",block:"start"});
  }
  function restartGame() {
    state.groupIndex=0; state.completed=new Set(); state.attempts={}; state.wrongChoices={}; state.firstTryCorrect=new Set(); state.finished=false;
    $("save-status").textContent=""; renderQuestions(); $("game-heading").scrollIntoView({behavior:"smooth",block:"start"});
  }
  function playTone(correct) {
    if(!state.soundEnabled) return;
    const AudioCtor=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtor) return;
    const context=new AudioCtor(), oscillator=context.createOscillator(), gain=context.createGain();
    oscillator.type="sine"; oscillator.frequency.value=correct?523.25:261.63;
    gain.gain.setValueAtTime(.001,context.currentTime);
    gain.gain.exponentialRampToValueAtTime(.08,context.currentTime+.03);
    gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+(correct?.28:.18));
    oscillator.connect(gain); gain.connect(context.destination); oscillator.start();
    oscillator.stop(context.currentTime+(correct?.3:.2)); oscillator.onended=()=>context.close();
  }
  function renderHistory(records) {
    const holder=$("history-list"); holder.replaceChildren();
    if(!records.length) { const empty=document.createElement("p"); empty.className="rounded-2xl bg-[#edf7f7] px-4 py-4 font-semibold text-[#466574]"; empty.textContent="目前還沒有作答紀錄。"; holder.append(empty); return; }
    [...records].sort((a,b)=>String(b.completed_at||"").localeCompare(String(a.completed_at||""))).forEach(record=>{
      const article=document.createElement("article"); article.dataset.recordId=record.__backendId;
      article.className="rounded-2xl border-2 border-[#d6e8e6] bg-white px-4 py-4";
      const title=document.createElement("h3"); title.className="font-bold text-[#164e6c]"; title.textContent=record.student_name||"未署名";
      const stats=document.createElement("p"); stats.className="mt-2 font-semibold text-[#466574]";
      stats.textContent="作答 "+(record.total_attempts??0)+" 次｜一次答對 "+(record.first_try_correct??0)+" 題";
      const wrong=document.createElement("p"); wrong.className="mt-1 whitespace-pre-line text-[#527083]";
      wrong.textContent="錯題："+(record.wrong_questions||"無");
      article.append(title,stats,wrong); holder.append(article);
    });
  }
  const dataHandler={onDataChanged(data) {
    clearTimeout(initialLoadTimer); readReady=true; backendRecords=data; $("retry-button").classList.add("hidden"); renderHistory(data);
  }};
  function showReadError(message) {
    if(readReady) return;
    $("history-list").textContent=message;
    $("retry-button").classList.remove("hidden");
  }
  async function initializeData() {
    readReady=false; $("retry-button").classList.add("hidden"); $("history-list").textContent="正在讀取作答紀錄…";
    clearTimeout(initialLoadTimer);
    initialLoadTimer=setTimeout(()=>showReadError("無法讀取作答紀錄，請按下重試。"),8000);
    try {
      const result=await window.dataSdk.init(dataHandler);
      if(!result.isOk) { clearTimeout(initialLoadTimer); showReadError("無法連接作答紀錄，請按下重試。"); }
    } catch { clearTimeout(initialLoadTimer); showReadError("無法連接作答紀錄，請按下重試。"); }
  }
  async function showCompletion() {
    state.finished=true; updateNextButton();
    const attempts=Object.values(state.attempts).reduce((sum,n)=>sum+n,0);
    $("completion-text").textContent=state.studentName+"，你完成了 "+questionBank.length+" 題練習！共作答 "+attempts+" 次，其中一次答對 "+state.firstTryCorrect.size+" 題。";
    $("completion-summary").classList.remove("hidden");
    $("completion-summary").scrollIntoView({behavior:"smooth",block:"nearest"});
    const status=$("save-status");
    status.textContent="正在儲存作答紀錄…"; status.className="mt-2 font-semibold text-[#356246]";
    if(backendRecords.length>=999) { status.textContent="作答紀錄已達 999 筆上限，這次無法儲存。"; return; }
    const wrong=questionBank.filter(q=>(state.attempts[q.id]||0)>1).map(q=>
      "題目："+q.sentence+"｜我的答案："+[...new Set(state.wrongChoices[q.id]||[])].join("、")+"｜正確答案："+q.word
    ).join("\n");
    try {
      const result=await window.dataSdk.create({
        student_name:state.studentName,total_attempts:attempts,first_try_correct:state.firstTryCorrect.size,
        wrong_questions:wrong,completed_at:new Date().toISOString()
      });
      if(!state.finished) return;
      status.textContent=result.isOk?"作答紀錄已儲存。":"無法確認作答紀錄是否儲存，請先查看歷史紀錄或重新整理，避免重複提交。";
      if(!result.isOk) status.className="mt-2 font-semibold text-[#8b4d33]";
    } catch {
      if(state.finished) { status.textContent="無法確認作答紀錄是否儲存，請先查看歷史紀錄或重新整理，避免重複提交。"; status.className="mt-2 font-semibold text-[#8b4d33]"; }
    }
  }
  $("name-form").addEventListener("submit",event=>{
    event.preventDefault();
    const input=$("student-name"),name=input.value.trim();
    if(!name) { $("name-message").textContent="請先輸入姓名，再開始練習。"; input.focus(); return; }
    state.studentName=name; $("name-message").textContent="";
    $("name-panel").classList.add("hidden");
    ["settings-panel","game-section","reference-section"].forEach(id=>$(id).classList.remove("hidden"));
    $("student-display").textContent="學生："+name;
    renderCompleteContent(); renderQuestions();
  });
  $("next-button").addEventListener("click",moveNext);
  $("restart-button").addEventListener("click",restartGame);
  $("retry-button").addEventListener("click",initializeData);
  $("font-size-button").addEventListener("click",()=>{
    state.fontStep=(state.fontStep+1)%3;
    document.body.classList.toggle("text-large",state.fontStep===1);
    document.body.classList.toggle("text-extra-large",state.fontStep===2);
  });
  $("contrast-button").addEventListener("click",event=>{
    const active=document.body.classList.toggle("high-contrast");
    event.currentTarget.classList.toggle("is-active",active);
    event.currentTarget.setAttribute("aria-pressed",String(active));
  });
  $("sound-button").addEventListener("click",event=>{
    state.soundEnabled=!state.soundEnabled;
    event.currentTarget.classList.toggle("is-active",state.soundEnabled);
    event.currentTarget.setAttribute("aria-pressed",String(state.soundEnabled));
  });
  if(window.lucide) lucide.createIcons();
  initializeData();
</script>
 
</body></html>
